<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="0%" r="70%">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.30"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="18%" r="60%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0d16"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- logo -->
  <g transform="translate(72,64)">
    <rect width="60" height="60" rx="15" fill="url(#g)"/>
    <g transform="scale(0.625)">
      <path d="M20 28 L20 64 L34 64" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="48" cy="46" r="11" fill="none" stroke="#fff" stroke-width="6.5"/><circle cx="48" cy="46" r="3" fill="#fff"/>
      <circle cx="48" cy="35" r="2.4" fill="#fff"/><circle cx="58" cy="52" r="2.4" fill="#fff"/><circle cx="38" cy="52" r="2.4" fill="#fff"/>
      <path d="M63 28 L63 64 M79 28 L79 64 M63 46 L79 46" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
    </g>
    <text x="76" y="41" font-size="30" font-weight="800" fill="#fff" letter-spacing="-0.5">LiveOpsHub</text>
  </g>

  <!-- headline -->
  <text x="72" y="290" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-2">You go live.</text>
  <text x="72" y="382" font-size="70" font-weight="800" fill="url(#g)" letter-spacing="-2">We run the rest.</text>
  <text x="74" y="440" font-size="30" font-weight="500" fill="#c3c7d6">The operations hub for live-selling businesses.</text>

  <!-- platform chips -->
  <g transform="translate(72,500)" font-size="21" font-weight="700">
    <rect x="0" y="0" width="150" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="26" y="30" fill="#e6e8ee">TikTok Shop</text>
    <rect x="168" y="0" width="118" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="192" y="30" fill="#e6e8ee">Whatnot</text>
    <rect x="304" y="0" width="86" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="328" y="30" fill="#e6e8ee">eBay</text>
  </g>

  <!-- product mock card (right) -->
  <g transform="translate(770,150)">
    <rect x="0" y="0" width="360" height="330" rx="20" fill="#0f1327" stroke="rgba(255,255,255,0.10)"/>
    <rect x="0" y="0" width="360" height="44" rx="20" fill="#141a33"/>
    <rect x="0" y="24" width="360" height="20" fill="#141a33"/>
    <circle cx="24" cy="22" r="5" fill="#3a4162"/><circle cx="42" cy="22" r="5" fill="#3a4162"/><circle cx="60" cy="22" r="5" fill="#3a4162"/>
    <!-- kpis -->
    <g transform="translate(20,64)">
      <rect x="0" y="0" width="100" height="66" rx="11" fill="#151b36"/>
      <text x="14" y="26" font-size="11" fill="#7b83a8" font-weight="700">NET SALES</text>
      <text x="14" y="50" font-size="21" fill="#34d399" font-weight="800">$18.4k</text>
      <rect x="110" y="0" width="100" height="66" rx="11" fill="#151b36"/>
      <text x="124" y="26" font-size="11" fill="#7b83a8" font-weight="700">PACKED</text>
      <text x="124" y="50" font-size="21" fill="#60a5fa" font-weight="800">642</text>
      <rect x="220" y="0" width="100" height="66" rx="11" fill="#151b36"/>
      <text x="234" y="26" font-size="11" fill="#7b83a8" font-weight="700">AVG PACK</text>
      <text x="234" y="50" font-size="21" fill="#f472b6" font-weight="800">54s</text>
    </g>
    <!-- chart -->
    <g transform="translate(20,150)">
      <rect x="0" y="0" width="320" height="160" rx="11" fill="#151b36"/>
      <text x="16" y="26" font-size="12" fill="#9aa2c6" font-weight="700">Revenue by show</text>
      <g transform="translate(16,40)" fill="#6366f1">
        <rect x="0" y="70" width="30" height="60" rx="3"/><rect x="42" y="46" width="30" height="84" rx="3"/>
        <rect x="84" y="82" width="30" height="48" rx="3"/><rect x="126" y="20" width="30" height="110" rx="3" fill="#8b5cf6"/>
        <rect x="168" y="56" width="30" height="74" rx="3"/><rect x="210" y="10" width="30" height="120" rx="3" fill="#ec4899"/>
        <rect x="252" y="50" width="30" height="80" rx="3"/>
      </g>
    </g>
  </g>
</svg>
