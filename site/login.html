<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · LiveOpsHub</title>
  <!-- The real, secure login lives inside the app (same origin as your data, with CSRF
       protection and the session cookie). This page just forwards you there — so there is
       exactly one login, and it always works. Set APP_URL to your deployed app. -->
  <script>
    var APP_URL = "https://app.liveopshub.com";   // ← your live app origin (e.g. https://getwhatnot.com)
    // Preserve a ?next= deep link if present.
    var qs = new URLSearchParams(location.search);
    var dest = APP_URL + "/login" + (qs.get("next") ? ("?next=" + encodeURIComponent(qs.get("next"))) : "");
    location.replace(dest);
  </script>
  <meta http-equiv="refresh" content="1;url=https://app.liveopshub.com/login">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0c0f16;color:#e9edf6;font-family:'Inter',-apple-system,'Segoe UI',sans-serif;text-align:center}
    .box{max-width:380px;padding:24px}
    .brand{font-weight:900;font-size:22px;margin-bottom:14px}
    .brand span{color:#818cf8}
    p{color:#9aa4b8;font-size:15px;line-height:1.6}
    a{color:#818cf8;font-weight:700}
    .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.15);border-top-color:#8b5cf6;
      border-radius:50%;margin:18px auto;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">LiveOps<span>Hub</span></div>
    <div class="spin"></div>
    <p>Taking you to your company's secure login…<br>
       If nothing happens, <a href="https://app.liveopshub.com/login">click here to log in</a>.</p>
  </div>
</body>
</html>
