<svg width="880" height="600" viewBox="0 0 880 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'DM Sans', Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <!-- LOH monogram: L, hub-O (ring+node), H -->
    <symbol id="loh" viewBox="0 0 96 96">
      <path d="M20 28 L20 64 L34 64" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="48" cy="46" r="11" fill="none" stroke="#fff" stroke-width="6.5"/>
      <circle cx="48" cy="46" r="3" fill="#fff"/>
      <circle cx="48" cy="35" r="2.4" fill="#fff"/><circle cx="58" cy="52" r="2.4" fill="#fff"/><circle cx="38" cy="52" r="2.4" fill="#fff"/>
      <path d="M63 28 L63 64 M79 28 L79 64 M63 46 L79 46" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="880" height="600" fill="#ffffff"/>

  <!-- section label -->
  <text x="60" y="52" font-size="13" font-weight="700" letter-spacing="2" fill="#9aa1b2">APP ICON / MARK</text>

  <!-- gradient badge -->
  <g>
    <rect x="60" y="72" width="112" height="112" rx="26" fill="url(#g)"/>
    <use href="#loh" x="60" y="72" width="112" height="112"/>
  </g>
  <!-- badge on dark tile -->
  <rect x="200" y="72" width="112" height="112" rx="26" fill="#0f1222"/>
  <rect x="216" y="88" width="80" height="80" rx="18" fill="url(#g)"/>
  <use href="#loh" x="216" y="88" width="80" height="80"/>
  <!-- monochrome (ink) badge -->
  <rect x="340" y="72" width="112" height="112" rx="26" fill="#0f1222"/>
  <use href="#loh" x="340" y="72" width="112" height="112"/>

  <text x="60" y="214" font-size="12.5" fill="#9aa1b2">Gradient · On-dark · Monochrome</text>

  <!-- horizontal lockup on light -->
  <text x="60" y="278" font-size="13" font-weight="700" letter-spacing="2" fill="#9aa1b2">HORIZONTAL LOCKUP</text>
  <rect x="60" y="300" width="72" height="72" rx="18" fill="url(#g)"/>
  <use href="#loh" x="60" y="300" width="72" height="72"/>
  <text x="150" y="348" font-size="38" font-weight="800" letter-spacing="-1">
    <tspan fill="#0f1222">Live</tspan><tspan fill="url(#g)">Ops</tspan><tspan fill="#0f1222">Hub</tspan>
  </text>
  <text x="152" y="368" font-size="12.5" font-weight="600" letter-spacing="3" fill="#8a90a2">THE OPERATIONS HUB FOR LIVE SELLING</text>

  <!-- reversed lockup on dark bar -->
  <rect x="60" y="410" width="760" height="130" rx="20" fill="#0b0d16"/>
  <rect x="92" y="444" width="62" height="62" rx="16" fill="url(#g)"/>
  <use href="#loh" x="92" y="444" width="62" height="62"/>
  <text x="172" y="486" font-size="34" font-weight="800" letter-spacing="-1">
    <tspan fill="#ffffff">Live</tspan><tspan fill="url(#g)">Ops</tspan><tspan fill="#ffffff">Hub</tspan>
  </text>
  <text x="174" y="505" font-size="11.5" font-weight="600" letter-spacing="3" fill="#8b90a5">YOU GO LIVE. WE RUN THE REST.</text>

  <!-- wordmark only, small -->
  <text x="620" y="150" font-size="30" font-weight="800" letter-spacing="-1">
    <tspan fill="#0f1222">Live</tspan><tspan fill="url(#g)">Ops</tspan><tspan fill="#0f1222">Hub</tspan>
  </text>
  <text x="620" y="112" font-size="13" font-weight="700" letter-spacing="2" fill="#9aa1b2">WORDMARK</text>
</svg>
