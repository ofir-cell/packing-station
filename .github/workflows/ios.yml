# Compiles the native iOS app (ios/) on every change to it. Unsigned simulator
# build — this proves the code compiles; signing/archiving happens in Xcode.
name: iOS build

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Upload ready-to-open Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: LiveOpsHub-iOS-project
          path: |
            ios/
            !ios/build.log
          retention-days: 30

      - name: Build (simulator, unsigned)
        run: |
          cd ios
          set -o pipefail
          xcodebuild build \
            -project LiveOpsHub.xcodeproj \
            -scheme LiveOpsHub \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
