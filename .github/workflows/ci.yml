# Runs the test suite and the inline-JS syntax check on every push and pull request.
# Railway deploys every push to main, so a red check here means: do not merge.
# (Turn on "Wait for CI" in the Railway service settings so a failing check also
# blocks the deploy itself.)
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout

      - name: Tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --timeout=600 tests -rfE 2>&1 | tee out.txt
          code=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR)|^E  " out.txt | head -25 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          exit $code

      - name: Inline JS syntax check
        run: python check_js.py
