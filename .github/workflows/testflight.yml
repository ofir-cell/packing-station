# Builds the signed iOS app and uploads it to TestFlight (App Store Connect).
#
# Runs when iOS code lands on main, or by hand: Actions → "TestFlight" → Run workflow.
# The build then shows up in App Store Connect → Live Ops Hub → TestFlight after
# Apple finishes processing it (usually 10–20 minutes).
#
# One-time setup — three repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      Key ID of an App Store Connect API key
#   ASC_ISSUER_ID   Issuer ID shown above the keys list
#   ASC_KEY_P8      the full contents of the downloaded AuthKey_XXXXXXXXXX.p8 file
# Create the key in App Store Connect → Users and Access → Integrations → App Store
# Connect API → Team Keys, with the Admin role (Xcode needs it to create the
# distribution certificate and profile on its own). The .p8 downloads once — keep it safe.
#
# Signing is automatic: Xcode creates and renews the certificate and profile through
# the API key, so there is nothing to export from a Mac and nothing to rotate by hand.
name: TestFlight

on:
  push:
    branches: [main, "testflight/**"]     # testflight/* branches: for fixing this pipeline itself
    paths: ["ios/**", ".github/workflows/testflight.yml"]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false        # never cancel an upload halfway

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TEAM_ID: 4B4X663V8J            # BTRADE LLC
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check the App Store Connect key is configured
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See the setup notes at the top of .github/workflows/testflight.yml."
            exit 1
          fi

      - uses: actions/checkout@v4

      # App Store Connect only accepts builds made with Xcode 26 / the iOS 26 SDK or later.
      - name: Select Xcode (26 or later)
        run: |
          XC="$(ls -d /Applications/Xcode_[2-9][0-9]*.app 2>/dev/null | grep -Ev 'Xcode_(1[0-9]|2[0-5])[._]' | grep -vi beta | sort -V | tail -1)"
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26+ on this runner. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Write the API key to disk
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # The archive is built UNSIGNED and signed in the next step. Signing during
      # `archive` makes Xcode ask Apple for a *development* profile, which needs at
      # least one registered device on the team ("Your team has no devices…").
      # Signing at export only needs the App Store profile, which needs no devices.
      # Every upload needs a build number higher than the last one; the run number is.
      - name: Archive
        run: |
          cd ios
          set -o pipefail
          xcodebuild archive \
            -project LiveOpsHub.xcodeproj \
            -scheme LiveOpsHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LiveOpsHub.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee "$RUNNER_TEMP/archive.log" | tail -n 40

      - name: Sign and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LiveOpsHub.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log" | tail -n 40
          echo "### Uploaded build ${{ github.run_number }} to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in App Store Connect → Live Ops Hub → TestFlight once Apple finishes processing (10–20 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Keep the build logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          retention-days: 7
