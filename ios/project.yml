# XcodeGen spec for the LiveOpsHub iOS app.
# Generate the Xcode project on a Mac:   brew install xcodegen && cd ios && xcodegen
# Then open LiveOpsHub.xcodeproj, pick your Team under Signing, and run.
name: LiveOpsHub
options:
  bundleIdPrefix: com.liveopshub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "4B4X663V8J"   # BTRADE LLC
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  LiveOpsHub:
    type: application
    platform: iOS
    scheme: {}                     # shared scheme, needed by CI and archiving
    sources:
      - path: LiveOpsHub
    info:
      path: LiveOpsHub/Info.plist
      properties:
        CFBundleDisplayName: LiveOpsHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        API_BASE_URL: https://www.getwhatnot.com
        NSPhotoLibraryAddUsageDescription: Save exported reports and packing videos to your Photos.
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: LiveOpsHub uses the camera to scan shipping labels and product barcodes, and to record a packing video of each order as proof of what was shipped.
        NSMicrophoneUsageDescription: Packing videos include audio so your team can narrate the contents of each package.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liveopshub.app
        TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad (camera follows the device orientation)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
